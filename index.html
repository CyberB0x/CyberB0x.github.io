<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Проекты CyberB0x</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #1c1f26;
      color: #e0e0e0;
      font-family: 'Fira Code', monospace;
    }
    h1, h5 {
      color: #5ef1ba;
    }
    .nav-pills .nav-link {
      color: #5ef1ba;
      border: 1px solid #5ef1ba;
      margin: 2px;
    }
    .nav-pills .nav-link.active {
      background-color: #5ef1ba;
      color: #1c1f26;
    }
    .btn-outline-success {
      color: #5ef1ba;
      border-color: #5ef1ba;
    }
    .btn-outline-success:hover {
      background-color: #5ef1ba;
      color: #1c1f26;
    }
    .card {
      background-color: #2a2e38;
      border: 1px solid #444;
      border-radius: 10px;
      transition: 0.3s ease;
    }
    .card:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(94, 241, 186, 0.1);
    }
    .card-title { color: #ffffff; }
    .card-text { color: #cccccc; }
    .btn-primary {
      background-color: #5ef1ba;
      border: none;
      color: #1c1f26;
    }
    .btn-primary:hover {
      background-color: #00cc99;
    }
    .badge {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 10px;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h1 class="text-center mb-5">Проекты CyberB0x</h1>

    <!-- Меню категорий -->
    <ul class="nav nav-pills justify-content-center flex-wrap mb-4" id="categoryMenu">
      <li class="nav-item"><a class="nav-link active" onclick="filterCategory('all')">Все</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('python')">Python</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('django')">Django</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('sql')">SQL</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('security')">Security</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('telegram')">Telegram</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('image')">Image</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('extension')">Extension</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('wifi')">WiFi</a></li>
      <li class="nav-item"><a class="nav-link" onclick="filterCategory('healthcare')">Healthcare</a></li>
    </ul>

    <!-- Меню сложности -->
    <div class="text-center mb-5">
      <h5>Сложность:</h5>
      <div class="btn-group flex-wrap">
        <button class="btn btn-outline-success" onclick="filterDifficulty('all')">Все</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('beginner')">Начальный</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('intermediate')">Средний</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('advanced')">Продвинутый</button>
      </div>
    </div>

    <!-- Список проектов -->
    <div class="row" id="project-list">
      <!-- Сюда вставляются карточки проектов (используй свой HTML-фрагмент с карточками) -->
      <!-- Пример одной карточки ниже: -->

      <div class="col-md-6 mb-4 project-card python beginner">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">Telegram Bot</h5>
            <p class="card-text">Умный бот с API и кастомными функциями.</p>
            <span class="badge bg-success">Начальный</span>
            <a href="https://github.com/CyberB0x/Project_Telegram_bot" class="btn btn-primary mt-2">GitHub →</a>
          </div>
        </div>
      </div>

      <!-- Добавь сюда остальные карточки из предыдущего шаблона -->
    </div>
  </div>

  <script>
    function filterCategory(category) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        card.style.display = (category === 'all' || card.classList.contains(category)) ? 'block' : 'none';
      });

      // Активный класс в меню
      document.querySelectorAll('#categoryMenu .nav-link').forEach(link => {
        link.classList.remove('active');
      });
      event.target.classList.add('active');
    }

    function filterDifficulty(level) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        card.style.display = (level === 'all' || card.classList.contains(level)) ? 'block' : 'none';
      });
    }
  </script>

</body>
</html>
