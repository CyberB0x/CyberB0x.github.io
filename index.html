<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌟 Проекты CyberB0x</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Fira Code', monospace;
      background-color: #121212;
      color: #ffffff;
    }
    .btn-outline-primary {
      border-color: #306998;
      color: #306998;
    }
    .btn-outline-primary:hover {
      background-color: #306998;
      color: white;
    }
    .btn-primary {
      background-color: #306998;
      border-color: #306998;
    }
    .btn-primary:hover {
      background-color: #1e4976;
      border-color: #1e4976;
    }
    .card {
      background-color: #1e1e1e;
      border: none;
      transition: transform 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
    }
    .badge {
      font-size: 0.8em;
    }
  </style>
</head>
<body>

  <div class="container py-5">
    <h1 class="text-center mb-4">💻 Python Full Stack проекты</h1>

    <div class="text-center mb-3">
      <h5>📂 Категории:</h5>
      <div class="btn-group flex-wrap" role="group">
        <button class="btn btn-outline-primary" onclick="filterCategory('all')">Все</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('django')">Django</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('flask')">Flask</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('sql')">SQL</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('security')">Security</button>
      </div>
    </div>

    <div class="text-center mb-4">
      <h5>🚦 Сложность:</h5>
      <div class="btn-group flex-wrap" role="group">
        <button class="btn btn-outline-success" onclick="filterDifficulty('all')">Все</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('beginner')">Начальный</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('intermediate')">Средний</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('advanced')">Продвинутый</button>
      </div>
    </div>

    <div class="row" id="project-list">

      <div class="col-md-6 mb-4 project-card django security advanced" data-aos="fade-up">
        <div class="card shadow-sm">
          <div class="card-body">
            <h5 class="card-title">🛡️ ThreatLens</h5>
            <p class="card-text">Веб-приложение на Django для анализа файлов и URL.</p>
            <span class="badge bg-danger">Продвинутый</span>
            <div class="mt-2">
              <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/python/python-original.svg" width="20">
              <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/django/django-plain.svg" width="20">
              <img src="https://cdn.jsdelivr.net/gh/devicons/devicon/icons/mysql/mysql-original.svg" width="20">
            </div>
            <a href="https://github.com/CyberB0x/ThreatLens" class="btn btn-primary mt-2">GitHub →</a>
          </div>
        </div>
      </div>

      <!-- Добавь остальные проекты аналогично -->

    </div>

    <div class="text-center mt-5">
      <h5>📊 GitHub Статистика</h5>
      <img src="https://github-readme-stats.vercel.app/api?username=CyberB0x&show_icons=true&theme=radical" class="img-fluid mb-3">
      <img src="https://github-readme-streak-stats.herokuapp.com?user=CyberB0x&theme=radical" class="img-fluid">
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script>
    AOS.init();
    function filterCategory(category) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
    function filterDifficulty(level) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        if (level === 'all' || card.classList.contains(level)) {
          card.style.display = 'block';
        } else {
          card.style.display = 'none';
        }
      });
    }
  </script>
</body>
</html>
