<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌟 Проекты CyberB0x</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f1117;
      color: #d3d3d3;
      font-family: 'Fira Code', monospace;
    }
    h1, h5 {
      color: #5ef1ba;
    }
    .card {
      background-color: #1a1e29;
      border: 1px solid #333;
      border-radius: 12px;
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(94, 241, 186, 0.2);
    }
    .card-title { color: #fff; }
    .card-text { color: #ccc; }
    .btn-primary {
      background-color: #5ef1ba;
      border: none;
      color: #0f1117;
    }
    .btn-primary:hover {
      background-color: #00cc99;
    }
    .btn-outline-primary, .btn-outline-success {
      color: #5ef1ba;
      border-color: #5ef1ba;
    }
    .btn-outline-primary:hover, .btn-outline-success:hover {
      background-color: #5ef1ba;
      color: #0f1117;
    }
    .badge {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 10px;
    }
    footer {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid #333;
      color: #888;
    }
    a {
      color: #5ef1ba;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
    .project-card { display: block; }
    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="container py-5">
    <h1 class="text-center mb-4">🌟 Мои проекты</h1>

    <!-- Категории -->
    <div class="text-center mb-3">
      <h5>Категории:</h5>
      <div class="btn-group flex-wrap">
        <button class="btn btn-outline-primary" onclick="filterCategory('all')">Все</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('security')">Security</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('python')">Python</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('sql')">SQL</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('django')">Django</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('telegram')">Telegram</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('image')">Image</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('extension')">Extension</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('wifi')">WiFi</button>
        <button class="btn btn-outline-primary" onclick="filterCategory('healthcare')">Healthcare</button>
      </div>
    </div>

    <!-- Сложность -->
    <div class="text-center mb-4">
      <h5>Сложность:</h5>
      <div class="btn-group flex-wrap">
        <button class="btn btn-outline-success" onclick="filterDifficulty('all')">Все</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('beginner')">Начальный</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('intermediate')">Средний</button>
        <button class="btn btn-outline-success" onclick="filterDifficulty('advanced')">Продвинутый</button>
      </div>
    </div>

    <!-- Проекты -->
    <div class="row" id="project-list">
      <!-- Здесь будут все проекты -->
      <!-- Я добавил отдельным файлом → см. в комментарии ниже -->
      <!-- ✅ ВСТАВЬ СЮДА ВСЕ БЛОКИ ПРОЕКТОВ ИЗ ТВОЕГО HTML -->
      <!-- Например: -->
      <div class="col-md-6 mb-4 project-card python telegram beginner">
        <div class="card">
          <div class="card-body">
            <h5 class="card-title">🚀 Telegram Bot</h5>
            <p class="card-text">Умный бот с API и кастомными функциями.</p>
            <span class="badge bg-success">Начальный</span>
            <a href="https://github.com/CyberB0x/Project_Telegram_bot" class="btn btn-primary mt-2">GitHub →</a>
          </div>
        </div>
      </div>

      <!-- Вставь остальные блоки из твоего исходного кода: HelpDesk, SQL Manager и т.д. -->

      <!-- Пример конца -->
    </div>
  </div>

  <!-- Футер -->
  <footer class="text-center">
    <p>👨‍💻 Сделано с 💻 и ☕ — <a href="https://github.com/CyberB0x" target="_blank">CyberB0x</a> © 2025</p>
  </footer>

  <!-- Скрипт фильтрации -->
  <script>
    function filterCategory(category) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        if (category === 'all' || card.classList.contains(category)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }

    function filterDifficulty(level) {
      const cards = document.querySelectorAll('.project-card');
      cards.forEach(card => {
        if (level === 'all' || card.classList.contains(level)) {
          card.classList.remove('hidden');
        } else {
          card.classList.add('hidden');
        }
      });
    }
  </script>

</body>
</html>
