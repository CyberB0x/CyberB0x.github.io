<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>🌟 Проекты CyberB0x</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code&display=swap" rel="stylesheet">
  <style>
    body {
      background-color: #0f1117;
      color: #d3d3d3;
      font-family: 'Fira Code', monospace;
    }
    h1, h5 {
      color: #5ef1ba;
    }
    .card {
      background-color: #1a1e29;
      border: 1px solid #333;
      border-radius: 12px;
      transition: transform 0.2s ease-in-out, box-shadow 0.3s ease-in-out;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(94, 241, 186, 0.2);
    }
    .card-title {
      color: #ffffff;
    }
    .card-text {
      color: #ccc;
    }
    .btn-primary {
      background-color: #5ef1ba;
      border: none;
      color: #0f1117;
    }
    .btn-primary:hover {
      background-color: #00cc99;
    }
    .btn-outline-primary,
    .btn-outline-success {
      color: #5ef1ba;
      border-color: #5ef1ba;
    }
    .btn-outline-primary:hover,
    .btn-outline-success:hover {
      background-color: #5ef1ba;
      color: #0f1117;
    }
    .badge {
      font-size: 0.8rem;
      padding: 6px 10px;
      border-radius: 10px;
    }
    footer {
      margin-top: 60px;
      padding-top: 30px;
      border-top: 1px solid #333;
      color: #888;
    }
    a {
      color: #5ef1ba;
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }
  </style>
</head>

        <button class="btn btn-outline-primary">SQL</button>
        <button class="btn btn-outline-primary">Django</button>
        <button class="btn btn-outline-primary">Telegram</button>
        <button class="btn btn-outline-primary">Image</button>
        <button class="btn btn-outline-primary">Extension</button>

            <span class="badge bg-success">Начальный</span>
