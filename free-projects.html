<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>My Free Projects</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans text-gray-900">

  <header class="bg-white shadow">
    <div class="container mx-auto px-6 py-6 flex justify-between items-center">
      <h1 class="text-3xl font-bold text-indigo-600">My Free Projects</h1>
      <nav>
        <a href="#" class="text-gray-600 hover:text-indigo-600 mx-3 font-medium">Home</a>
        <a href="#" class="text-gray-600 hover:text-indigo-600 mx-3 font-medium">About</a>
        <a href="#" class="text-gray-600 hover:text-indigo-600 mx-3 font-medium">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container mx-auto px-6 py-10">
    <h2 class="text-2xl font-semibold mb-8 text-gray-800">Explore My Free Projects</h2>

    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-8">
      <!-- Project Card -->
      <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300">
        <img src="https://via.placeholder.com/400x250" alt="Project 1" class="rounded-t-lg w-full h-48 object-cover" />
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">Project One</h3>
          <p class="text-gray-600 mb-4">A brief description of project one. Clean, efficient, and free to use.</p>
          <a href="#" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">View Details</a>
        </div>
      </div>

      <!-- Repeat similar cards -->
      <div class="bg-white rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300">
        <img src="https://via.placeholder.com/400x250" alt="Project 2" class="rounded-t-lg w-full h-48 object-cover" />
        <div class="p-6">
          <h3 class="text-xl font-semibold mb-2">Project Two</h3>
          <p class="text-gray-600 mb-4">An awesome project with modern features and open-source code.</p>
          <a href="#" class="inline-block bg-indigo-600 text-white px-4 py-2 rounded hover:bg-indigo-700 transition">View Details</a>
        </div>
      </div>

      <!-- Add more cards as needed -->

    </div>
  </main>

  <footer class="bg-white border-t mt-12 py-6">
    <div class="container mx-auto px-6 text-center text-gray-600">
      &copy; 2025 My Free Projects. All rights reserved.
    </div>
  </footer>

</body>
</html>
